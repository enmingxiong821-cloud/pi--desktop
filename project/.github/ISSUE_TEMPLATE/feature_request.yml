name: 功能建议
description: 提出新功能或改进想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 描述当前工作流里的摩擦点，而不是直接给实现方案。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的做法
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: dropdown
    id: area
    attributes:
      label: 相关模块
      options:
        - 终端 / Pi 会话
        - 项目与配置
        - 模型与供应商接入
        - 自动化 / 协作
        - 搜索 / 抓取 / 逆向
        - 安全审计 / 授权渗透
        - 外观与布局
        - 打包与安装
        - 其他
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已搜索过现有 issue 与讨论
          required: true
        - label: 该建议不包含未授权扫描、命令透传、凭据攻击或规避检测
          required: true
